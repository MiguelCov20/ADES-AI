# Langfuse self-host (Fase 8) — stack mínimo para trazabilidad/eval.
# Uso:  docker compose -f docker-compose.langfuse.yml up -d
#
# Para despliegues con mucho tráfico, añade ClickHouse, MinIO y Redis según
# la guía oficial: https://langfuse.com/self-hosting
services:
  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse_db
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:3
    container_name: langfuse
    depends_on:
      - langfuse-db
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=cambia-este-secreto
      - SALT=cambia-este-salt
      - TELEMETRY_ENABLED=false
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  langfuse_db:
