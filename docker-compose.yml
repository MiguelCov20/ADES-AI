version: '3.8'

services:
  # 1. Base de Datos de Grafos (Neo4j) - Para el GraphRAG (Relaciones entre código y lógica)
  graph_memory:
    image: neo4j:5.23.0
    container_name: neo4j_graphrag
    environment:
      - NEO4J_AUTH=neo4j/password_seguro_123
    ports:
      - "7474:7474" # Interfaz web para visualizar el grafo
      - "7687:7687" # Puerto de conexión para tus agentes
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # 2. Base de Datos Vectorial (Qdrant) - Para memoria semántica a largo plazo y ahorro de tokens
  vector_memory:
    image: qdrant/qdrant:latest
    container_name: qdrant_memory
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # (Espacio reservado para el contenedor de Agentes LangGraph)
  # (Espacio reservado para el servidor Ollama LLM Local con acceso a tu GPU de 16GB)

volumes:
  neo4j_data:
  qdrant_data: